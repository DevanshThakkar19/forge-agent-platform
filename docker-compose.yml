# API + Postgres/pgvector + the React UI.
# The API process spawns the four MCP servers over stdio.
# They are not long-running Compose services.
# The web container proxies /health and /v1 to the API.

name: forge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - forge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      FORGE_API_KEY: ${FORGE_API_KEY:-dev-api-key}
      FORGE_DATABASE_URL: postgresql://forge:forge@postgres:5432/forge
      FORGE_SANDBOX_ROOT: /tmp/forge-sandbox
      FORGE_CORPUS_DIR: /app/corpus
      FORGE_TOOL_TRANSPORT: stdio
      FORGE_LOG_LEVEL: INFO
      FORGE_HOST: 0.0.0.0
      FORGE_PORT: "8000"
      FORGE_PLANNER: local
      FORGE_OLLAMA_URL: http://host.docker.internal:11434
      FORGE_OLLAMA_MODEL: mistral
      FORGE_PLANNER_TIMEOUT_S: "60"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  forge_pg:
